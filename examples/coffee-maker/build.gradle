/*
   Project coffee-maker
   Gradle build file for JaCaMo Coffee Making Application
*/

plugins {
    id 'com.gradleup.shadow' version '8.3.3'
    id 'java'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

defaultTasks 'run'

apply from: '.jcm-deps.gradle'

version '1.0'
group   'org.jacamo'

repositories {
    mavenLocal()
    maven { url "https://raw.githubusercontent.com/jacamo-lang/mvn-repo/master" }
    maven { url "https://repo.gradle.org/gradle/libs-releases" }
    flatDir { dirs 'lib' }
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation files('../../build/libs/jacamo-1.3.1-SNAPSHOT.jar')
    implementation files('../../Adaptation/build/libs/Adaptation-1.0.0-SNAPSHOT.jar')
    implementation('io.github.jason-lang:jason-interpreter:3.3.1')
    implementation('org.jacamo:cartago:3.1')
    implementation('org.jacamo:jaca:3.1')
    implementation('org.jacamo:moise:1.1')
    implementation('org.jacamo:npl:0.6.1')
    implementation('org.jacamo:intmas:1.0.0')
    implementation('org.jacamo:sai:0.5.4')
    implementation('org.antlr:antlr4:4.12.0')
}

sourceSets {
    main {
        java {
            srcDir 'src/env'
            srcDir 'src/agt'
            srcDir 'src/org'
            srcDir 'src/int'
            srcDir 'src/java'
        }
        resources {
            srcDir 'src/resources'
        }
    }
}

task run (type: JavaExec, dependsOn: 'classes') {
    group       ' JaCaMo'
    description 'runs the JaCaMo coffee-maker application'
    doFirst {
        mkdir 'log'
    }
    mainClass = 'jacamo.infra.JaCaMoLauncher'
    args 'coffee-maker.jcm'
    classpath sourceSets.main.runtimeClasspath
}

task buildJCMDeps (type: JavaExec, dependsOn: 'classes') {
    mainClass = 'jacamo.infra.RunJaCaMoProject'
    args = ['coffee-maker.jcm', '--deps']
    classpath sourceSets.main.runtimeClasspath
}

jar {
    duplicatesStrategy 'exclude'
    archiveBaseName = project.name
    from (project.projectDir.absolutePath + '/src') {
        include '**/*.asl'
        include '**/*.xml'
        include '**/*.sai'
        include '**/*.ptl'
        include '**/*.jcm'
        exclude 'test'
    }
    from (project.buildDir.absolutePath + '/classes') {
        include '**/*'
    }
    manifest {
        attributes 'Main-Class': 'jacamo.infra.JaCaMoLauncher'
    }
}

clean {
    delete 'bin'
    delete 'build'
    delete 'log'
}
